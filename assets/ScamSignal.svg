<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">ScamSignal message checker</title><desc id="desc">Dark safety interface analyzing a suspicious payment message and showing risk signals.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071311"/><stop offset="1" stop-color="#162923"/></linearGradient><linearGradient id="lime"><stop stop-color="#d4ff75"/><stop offset="1" stop-color="#8fcf45"/></linearGradient></defs>
  <rect width="1200" height="900" fill="url(#bg)"/><rect x="36" y="34" width="1128" height="832" rx="26" fill="#0c1714" stroke="#31433d" stroke-width="2"/>
  <text x="78" y="98" fill="#eef6ec" font-family="Arial" font-size="24" font-weight="700" letter-spacing="2">SCAMSIGNAL</text><circle cx="270" cy="88" r="5" fill="#b9f263"/><text x="287" y="94" fill="#9fb0a8" font-family="Arial" font-size="12" letter-spacing="2">CHECK BEFORE YOU TRUST</text><line x1="76" y1="130" x2="1124" y2="130" stroke="#2b3a35"/>
  <text x="78" y="206" fill="#b9f263" font-family="Arial" font-size="12" font-weight="700" letter-spacing="3">MESSAGE ANALYSIS</text><text x="78" y="278" fill="#f0f5ef" font-family="Georgia" font-size="54">Pause before you trust.</text><text x="78" y="318" fill="#9eaaa4" font-family="Arial" font-size="15">Paste a suspicious message or link. ScamSignal looks for pressure, payment requests,</text><text x="78" y="342" fill="#9eaaa4" font-family="Arial" font-size="15">impersonation, and risky URLs—without storing your message.</text>
  <rect x="78" y="390" width="618" height="245" rx="13" fill="#121f1b" stroke="#394a44"/><text x="105" y="426" fill="#91a29a" font-family="Arial" font-size="12" letter-spacing="2">SUSPICIOUS MESSAGE</text><text x="105" y="477" fill="#e6ece8" font-family="Arial" font-size="17">“Your GCash account will be suspended today.</text><text x="105" y="510" fill="#e6ece8" font-family="Arial" font-size="17">Verify immediately and send the ₱500 fee to</text><text x="105" y="543" fill="#e6ece8" font-family="Arial" font-size="17">restore access: secure-gcash-check.example”</text><rect x="105" y="581" width="172" height="35" rx="6" fill="url(#lime)"/><text x="132" y="604" fill="#18200f" font-family="Arial" font-size="12" font-weight="700" letter-spacing="1">CHECK MESSAGE →</text>
  <rect x="722" y="390" width="402" height="356" rx="13" fill="#101c18" stroke="#394a44"/><text x="751" y="428" fill="#91a29a" font-family="Arial" font-size="12" letter-spacing="2">SIGNAL REPORT</text><circle cx="1068" cy="419" r="7" fill="#e8986d"/><text x="751" y="481" fill="#f0f5ef" font-family="Georgia" font-size="38">High risk</text><text x="751" y="511" fill="#dda17e" font-family="Arial" font-size="13" letter-spacing="2">MULTIPLE WARNING SIGNS</text>
  <g font-family="Arial" font-size="14"><line x1="751" y1="545" x2="1095" y2="545" stroke="#30413b"/><circle cx="766" cy="579" r="6" fill="#e8986d"/><text x="788" y="584" fill="#d9e2dd">Urgent account threat</text><circle cx="766" cy="625" r="6" fill="#e8986d"/><text x="788" y="630" fill="#d9e2dd">Unexpected payment request</text><circle cx="766" cy="671" r="6" fill="#e8986d"/><text x="788" y="676" fill="#d9e2dd">Untrusted website address</text></g>
  <rect x="78" y="672" width="618" height="74" rx="10" fill="#17231f"/><text x="105" y="702" fill="#b9f263" font-family="Arial" font-size="12" font-weight="700">SAFER NEXT STEP</text><text x="105" y="729" fill="#c8d2cd" font-family="Arial" font-size="14">Do not pay or click. Contact the service through its official app.</text>
  <line x1="76" y1="800" x2="1124" y2="800" stroke="#2b3a35"/><text x="78" y="834" fill="#71837a" font-family="Arial" font-size="12" letter-spacing="2">PRIVATE BY DESIGN · NO MESSAGE STORAGE · ENGLISH + FILIPINO</text>
</svg>
