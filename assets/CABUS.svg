<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">CABUS four-in-one tracker interface</title>
  <desc id="desc">Dark purple productivity dashboard showing goals, tasks, fitness and expense tracking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111116"/><stop offset="1" stop-color="#20182b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#cab6ff"/><stop offset="1" stop-color="#8f6aef"/></linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="844" rx="26" fill="#15151b" stroke="#35313f" stroke-width="2"/>
  <rect x="28" y="28" width="245" height="844" rx="26" fill="#19191f"/>
  <rect x="245" y="28" width="28" height="844" fill="#19191f"/>
  <circle cx="83" cy="93" r="27" fill="url(#accent)"/><text x="73" y="108" fill="#1c1525" font-family="Arial,sans-serif" font-size="44" font-weight="700">c</text>
  <text x="126" y="92" fill="#f4f2fa" font-family="Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="4">CABUS</text>
  <text x="126" y="114" fill="#a1a0af" font-family="Arial,sans-serif" font-size="12">Your everyday, together.</text>
  <rect x="51" y="156" width="198" height="54" rx="10" fill="#282330" stroke="#3d3549"/>
  <circle cx="79" cy="183" r="15" fill="#463b58"/><text x="73" y="188" fill="#d9c8ff" font-family="Arial" font-size="13">P</text>
  <text x="105" y="179" fill="#e7e2ef" font-family="Arial" font-size="13">Personal workspace</text><text x="105" y="197" fill="#908b9b" font-family="Arial" font-size="10">Private account</text>
  <g font-family="Arial,sans-serif" font-size="15">
    <rect x="49" y="244" width="202" height="49" rx="9" fill="#362b48"/><text x="82" y="275" fill="#d9c8ff">Overview</text>
    <text x="82" y="334" fill="#a7a1b0">Goals</text><text x="82" y="387" fill="#a7a1b0">Tasks</text><text x="82" y="440" fill="#a7a1b0">Fitness</text><text x="82" y="493" fill="#a7a1b0">Expenses</text>
  </g>
  <line x1="273" y1="104" x2="1172" y2="104" stroke="#34313b"/>
  <text x="315" y="77" fill="#a5a0af" font-family="Arial" font-size="13">My workspace  /  <tspan fill="#e9e4f0">Overview</tspan></text>
  <rect x="1036" y="62" width="92" height="28" rx="5" fill="#2c2635" stroke="#4a3c5a"/><text x="1053" y="81" fill="#cbb6ef" font-family="Arial" font-size="11" letter-spacing="1">SAVED</text>
  <text x="315" y="165" fill="#f4f2fa" font-family="Arial" font-size="34" font-weight="600">Make today count.</text>
  <text x="315" y="194" fill="#9f9aaa" font-family="Arial" font-size="14">A clear view of your day. A little closer to your goals.</text>
  <g>
    <rect x="315" y="235" width="195" height="125" rx="12" fill="#1d1d24" stroke="#34323c"/><text x="338" y="270" fill="#b9b3c1" font-family="Arial" font-size="13">Goals in progress</text><text x="338" y="322" fill="#f4f2fa" font-family="Arial" font-size="36">4<tspan fill="#8d8795" font-size="18"> / 6</tspan></text>
    <rect x="525" y="235" width="195" height="125" rx="12" fill="#1d1d24" stroke="#34323c"/><text x="548" y="270" fill="#b9b3c1" font-family="Arial" font-size="13">Tasks today</text><text x="548" y="322" fill="#f4f2fa" font-family="Arial" font-size="36">7</text>
    <rect x="735" y="235" width="195" height="125" rx="12" fill="#1d1d24" stroke="#34323c"/><text x="758" y="270" fill="#b9b3c1" font-family="Arial" font-size="13">Workouts</text><text x="758" y="322" fill="#f4f2fa" font-family="Arial" font-size="36">3</text>
    <rect x="945" y="235" width="183" height="125" rx="12" fill="#1d1d24" stroke="#34323c"/><text x="968" y="270" fill="#b9b3c1" font-family="Arial" font-size="13">Budget left</text><text x="968" y="322" fill="#f4f2fa" font-family="Arial" font-size="30">₱8,450</text>
  </g>
  <rect x="315" y="382" width="510" height="395" rx="13" fill="#1c1c23" stroke="#34323c"/><text x="342" y="422" fill="#eee9f4" font-family="Arial" font-size="16" font-weight="600">Today’s tasks</text><text x="730" y="422" fill="#b69af0" font-family="Arial" font-size="12">View all →</text>
  <g font-family="Arial" font-size="14">
    <line x1="315" y1="448" x2="825" y2="448" stroke="#302e37"/><rect x="342" y="476" width="18" height="18" rx="5" fill="#8f6aef"/><text x="379" y="490" fill="#ddd8e5">Finish interface prototype</text><rect x="706" y="470" width="80" height="26" rx="5" fill="#33283f"/><text x="720" y="488" fill="#ccb5ef" font-size="11">PROJECT</text>
    <line x1="315" y1="521" x2="825" y2="521" stroke="#302e37"/><rect x="342" y="549" width="18" height="18" rx="5" fill="none" stroke="#706a78"/><text x="379" y="563" fill="#ddd8e5">Review weekly goals</text><rect x="706" y="543" width="80" height="26" rx="5" fill="#26372f"/><text x="724" y="561" fill="#9dd5b5" font-size="11">FOCUS</text>
    <line x1="315" y1="594" x2="825" y2="594" stroke="#302e37"/><rect x="342" y="622" width="18" height="18" rx="5" fill="none" stroke="#706a78"/><text x="379" y="636" fill="#ddd8e5">Log afternoon workout</text><rect x="706" y="616" width="80" height="26" rx="5" fill="#28313d"/><text x="723" y="634" fill="#a8c7ec" font-size="11">HEALTH</text>
  </g>
  <rect x="846" y="382" width="282" height="395" rx="13" fill="#1c1c23" stroke="#34323c"/><text x="873" y="422" fill="#eee9f4" font-family="Arial" font-size="16" font-weight="600">Goal progress</text>
  <g font-family="Arial" font-size="13"><text x="873" y="478" fill="#d8d3df">Build portfolio</text><text x="1073" y="478" fill="#cbb6ef">80%</text><rect x="873" y="496" width="222" height="7" rx="4" fill="#35323b"/><rect x="873" y="496" width="178" height="7" rx="4" fill="url(#accent)"/>
    <text x="873" y="558" fill="#d8d3df">Fitness target</text><text x="1073" y="558" fill="#cbb6ef">65%</text><rect x="873" y="576" width="222" height="7" rx="4" fill="#35323b"/><rect x="873" y="576" width="144" height="7" rx="4" fill="#91d3b0"/>
    <text x="873" y="638" fill="#d8d3df">Monthly savings</text><text x="1073" y="638" fill="#cbb6ef">45%</text><rect x="873" y="656" width="222" height="7" rx="4" fill="#35323b"/><rect x="873" y="656" width="100" height="7" rx="4" fill="#edbd89"/></g>
  <text x="315" y="829" fill="#bcaad8" font-family="Arial" font-size="13" letter-spacing="2">GOALS · TASKS · FITNESS · EXPENSES</text>
</svg>
